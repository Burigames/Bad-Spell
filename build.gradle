plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            if (project.hasProperty('qaWorld')) programArguments.addAll '--quickPlaySingleplayer', project.property('qaWorld')
        }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'badspell.tests', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'badspell'
        }
    }
    mods { badspell { sourceSet(sourceSets.main) } }
}
dependencies { implementation project(':core') }
// The dependency-free core must be bundled in the mod, not shipped as a second mod.
tasks.named('jar') {
    from project(':core').sourceSets.main.output
    from('LICENSE')
    from('docs/MDK_LICENSE.txt') { into 'META-INF/licenses' }
}
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_license: mod_license, neo_version: neo_version, minecraft_version_range: minecraft_version_range]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs.add('-Xlint:deprecation') }
tasks.named('check') { dependsOn ':core:check' }

// Validate mod-owned resource references without requiring a graphical client.
tasks.register('validateResources') {
    inputs.dir('src/main/resources')
    inputs.file('src/main/java/com/badspell/content/ModItems.java')
    doLast {
        def parser = new groovy.json.JsonSlurper()
        def root = file('src/main/resources/assets/badspell')
        def english = parser.parse(new File(root, 'lang/en_us.json'))
        def german = parser.parse(new File(root, 'lang/de_de.json'))
        if (english.keySet() != german.keySet()) throw new GradleException('Translation key sets differ')
        def source = file('src/main/java/com/badspell/content/ModItems.java').text
        def items = (source =~ /register(?:Simple)?Item\("([a-z_]+)"/).collect { it[1] }
        if (items.empty) throw new GradleException('No mod item registrations found')
        items.each { id ->
            if (!english.containsKey("item.badspell.${id}".toString())) throw new GradleException("Missing translation for ${id}")
            def definition = parser.parse(new File(root, "items/${id}.json"))
            if (definition.model.model != "badspell:item/${id}") throw new GradleException("Invalid item definition: ${id}")
            def model = parser.parse(new File(root, "models/item/${id}.json"))
            if (model.textures.layer0 != "badspell:item/${id}") throw new GradleException("Invalid texture reference: ${id}")
            byte[] png = new File(root, "textures/item/${id}.png").bytes
            if (png.length < 24 || java.nio.ByteBuffer.wrap(png, 16, 8).getInt() != 16 || java.nio.ByteBuffer.wrap(png, 20, 4).getInt() != 16) {
                throw new GradleException("Invalid texture dimensions: ${id}")
            }
        }
        logger.lifecycle("Validated ${items.size()} item definitions/models/textures and ${english.size()} bilingual keys")
    }
}
tasks.named('check') { dependsOn 'validateResources' }
