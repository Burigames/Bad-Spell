plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            if (project.hasProperty('qaWorld')) programArguments.addAll '--quickPlaySingleplayer', project.property('qaWorld')
        }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'badspell.tests', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'badspell'
        }
    }
    mods { badspell { sourceSet(sourceSets.main) } }
}
dependencies { implementation project(':core') }
// The dependency-free core must be bundled in the mod, not shipped as a second mod.
tasks.named('jar') {
    from project(':core').sourceSets.main.output
    from('LICENSE')
    from('docs/MDK_LICENSE.txt') { into 'META-INF/licenses' }
}
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_license: mod_license, neo_version: neo_version, minecraft_version_range: minecraft_version_range]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs.add('-Xlint:deprecation') }
tasks.named('check') { dependsOn ':core:check' }

// Validate mod-owned resource references without requiring a graphical client.
tasks.register('validateResources') {
    inputs.dir('src/main/resources')
    inputs.file('src/main/java/com/badspell/content/ModItems.java')
    doLast {
        def parser = new groovy.json.JsonSlurper()
        def root = file('src/main/resources/assets/badspell')
        def english = parser.parse(new File(root, 'lang/en_us.json'))
        def german = parser.parse(new File(root, 'lang/de_de.json'))
        if (english.keySet() != german.keySet()) throw new GradleException('Translation key sets differ')
        def definitions = new File(root, 'items').listFiles().findAll { it.name.endsWith('.json') }
        definitions.each { definitionFile ->
            def id = definitionFile.name[0..-6]
            def isBlock = new File(root, "blockstates/${id}.json").exists()
            def key = "${isBlock ? 'block' : 'item'}.badspell.${id}".toString()
            if (!english.containsKey(key)) throw new GradleException("Missing translation: ${key}")
            def definition = parser.parse(definitionFile)
            def modelId = definition.model.model
            def checked = [] as Set
            while (modelId?.startsWith('badspell:')) {
                if (!checked.add(modelId)) throw new GradleException("Model parent cycle: ${id}")
                def modelFile = new File(root, 'models/' + modelId.substring(9) + '.json')
                if (!modelFile.exists()) throw new GradleException("Missing model: ${modelId}")
                def model = parser.parse(modelFile)
                (model.textures ?: [:]).values().each { texture ->
                    if (texture.startsWith('badspell:')) {
                        def textureFile = new File(root, 'textures/' + texture.substring(9) + '.png')
                        if (!textureFile.exists()) throw new GradleException("Missing texture: ${texture}")
                        byte[] png = textureFile.bytes
                        if (png.length < 24 || java.nio.ByteBuffer.wrap(png, 16, 4).getInt() != 16 || java.nio.ByteBuffer.wrap(png, 20, 4).getInt() != 16) throw new GradleException("Invalid 16x16 texture: ${texture}")
                    }
                }
                // Minecraft 26.2 cuboid item models require all baked faces on one atlas.
                def atlases = [] as Set
                (model.elements ?: []).each { element ->
                    (element.faces ?: [:]).values().each { face ->
                        def texture = face.texture
                        def visitedTextures = [] as Set
                        while (texture?.startsWith('#') && visitedTextures.add(texture)) texture = (model.textures ?: [:])[texture.substring(1)]
                        if (texture && texture.contains(':')) {
                            def path = texture.substring(texture.indexOf(':') + 1)
                            if (path.startsWith('block/')) atlases.add('blocks')
                            if (path.startsWith('item/')) atlases.add('items')
                        }
                    }
                }
                if (atlases.size() > 1) throw new GradleException("Mixed Minecraft 26.2 atlases in cuboid model: ${modelId}")
                modelId = model.parent
            }
        }
        logger.lifecycle("Validated ${definitions.size()} item definitions and referenced models/textures; ${english.size()} bilingual keys")
    }
}
tasks.named('check') { dependsOn 'validateResources' }

// Opt-in acceptance harness. Its classes are deliberately excluded from the distributed mod JAR.
sourceSets {
    acceptance {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
if (project.hasProperty('qaM1')) {
    neoForge.mods.badspell.sourceSet(sourceSets.acceptance)
    neoForge.runs.server.gameDirectory = file('run/m1-acceptance-server')
    neoForge.runs.server.systemProperty 'badspell.acceptance.phase', project.findProperty('qaPhase') ?: '1'
    tasks.named('prepareServerRun') { dependsOn tasks.named('acceptanceClasses') }
}

if (project.hasProperty('qaM2')) {
    neoForge.mods.badspell.sourceSet(sourceSets.acceptance)
    neoForge.runs.server.gameDirectory = file('run/m2-acceptance-server')
    neoForge.runs.server.systemProperty 'badspell.acceptance.research', project.findProperty('qaPhase') ?: '1'
    tasks.named('prepareServerRun') { dependsOn tasks.named('acceptanceClasses') }
}

// Export an official prepared runtime for actual packaged-JAR clients, without dev mod folders.
tasks.register('writeAcceptanceClientCommand') {
    dependsOn 'prepareClientRun', 'jar'
    doLast {
        def run = tasks.named('runClient').get()
        def excluded = [layout.buildDirectory.dir('classes').get().asFile.toPath(), layout.buildDirectory.dir('resources').get().asFile.toPath(), project(':core').layout.buildDirectory.get().asFile.toPath()]
        def files = run.classpathProvider.files.findAll { file -> !excluded.any { file.toPath().startsWith(it) } }
        def command = [run.javaLauncher.get().executablePath.asFile.absolutePath, '@' + layout.buildDirectory.file('moddev/clientRunVmArgs.txt').get().asFile.absolutePath,
            '-Dfile.encoding=UTF-8', '-Duser.language=en', '-cp', files.collect { it.absolutePath }.join(File.pathSeparator),
            'net.neoforged.devlaunch.Main', '@' + layout.buildDirectory.file('moddev/clientRunProgramArgs.txt').get().asFile.absolutePath]
        layout.buildDirectory.file('acceptance-client-command.json').get().asFile.text = groovy.json.JsonOutput.toJson(command)
    }
}

tasks.register('validateResearchGuide') {
    inputs.dir('src/main/resources/data/badspell/recipe')
    inputs.file('src/main/resources/assets/badspell/guides/paths.json')
    doLast {
        def parser = new groovy.json.JsonSlurper()
        def source = file('src/main/resources/data/badspell/recipe').listFiles().findAll { it.name.endsWith('.json') }
        def guide = parser.parse(file('src/main/resources/assets/badspell/guides/paths.json'))
        if (guide.collect { it.id }.toSet() != source.collect { it.name[0..-6] }.toSet() || guide.size() != source.size()) throw new GradleException('Research guide recipe coverage differs; run scripts/generate-m2-assets.py')
        source.each { f ->
            def r = parser.parse(f)
            def g = guide.find { it.id == f.name[0..-6] }
            def outputs = r.type == 'badspell:processing' ? r.outputs : [r.result]
            def normalize = { value, count -> value instanceof String ? [id:value, count:count] : [id:(value.items instanceof String ? value.items : value.items[0]), count:count, water:true] }
            def expectedInputs = []
            if (r.type == 'badspell:processing') expectedInputs = r.inputs.collect { normalize(it.ingredient, it.count) }
            else if (r.type == 'minecraft:crafting_shaped') {
                def counts = [:].withDefault { 0 }
                r.pattern.join('').each { c -> if (c != ' ') counts[c]++ }
                expectedInputs = counts.collect { key, count -> normalize(r.key[key], count) }
            } else if (r.type == 'minecraft:crafting_shapeless') {
                r.ingredients.each { ingredient ->
                    def entry = normalize(ingredient, 1)
                    def old = expectedInputs.find { it.id == entry.id }
                    if (old) old.count++
                    else expectedInputs.add(entry)
                }
            } else expectedInputs = [normalize(r.ingredient, 1)]
            if (g.inputs != expectedInputs) throw new GradleException("Stale research inputs: ${f.name}")
            if (g.outputs != outputs) throw new GradleException("Stale research outputs: ${f.name}")
            if (r.type == 'badspell:processing' && (g.station != r.station || g.energy != r.energy || g.ticks != r.ticks)) throw new GradleException("Stale research costs: ${f.name}")
        }
        logger.lifecycle("Validated ${guide.size()} research crafting paths against recipe sources")
    }
}
tasks.named('check') { dependsOn 'validateResearchGuide' }
